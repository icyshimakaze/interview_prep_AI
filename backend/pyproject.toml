[project]
name = "interview-prep-backend"
version = "0.1.0"
description = "Typed FastAPI foundation for Interview Prep V2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "pyjwt[crypto]==2.15.1",
    "pypdf==6.20.1",
    "sqlalchemy[asyncio]==2.1.4",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_prep"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["integration: requires a migrated disposable PostgreSQL database"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]
